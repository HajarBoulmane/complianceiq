name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci   # factice, juste pour prisma generate
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22          # mets la même version que dans backend/Dockerfile
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npm run build

  rag-service:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rag-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: rag-service/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0            # gitleaks lit tout l'historique
      - name: Secrets scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: npm audit (dépendances de production)
        run: |
          for d in backend frontend rag-service; do
            echo "=== $d"
            (cd $d && npm audit --omit=dev --audit-level=critical)
          done

  docker:
    runs-on: ubuntu-latest
    needs: [backend, rag-service, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Fichier .env factice (aucun vrai secret en CI)
        run: |
          cat > .env <<'EOF'
          POSTGRES_PASSWORD=ci-dummy-password
          JWT_SECRET=ci-dummy-secret-ci-dummy-secret-ci-dummy
          GROQ_API_KEY=dummy
          RESEND_API_KEY=dummy
          VITE_GOOGLE_CLIENT_ID=dummy
          EOF
      - name: Build des images (sans l'override de dev)
        run: docker compose -f docker-compose.yml build