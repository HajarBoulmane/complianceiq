services:
  postgres:
    image: postgres:16-alpine
    container_name: complianceiq-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: complianceiq
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD missing}
      POSTGRES_DB: complianceiq
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U complianceiq -d complianceiq"]
      interval: 10s
      timeout: 5s
      retries: 5
  

  chromadb:
    image: chromadb/chroma:1.5.3
    container_name: complianceiq-chroma
    restart: unless-stopped
    volumes:
      - chroma_data:/data
   

  rag-service:
    build: ./rag-service
    container_name: complianceiq-rag
    restart: unless-stopped
    environment:
      RAG_PORT: 4000
      CHROMA_URL: http://chromadb:8000
      GROQ_API_URL: https://api.groq.com/openai/v1/chat/completions
      GROQ_API_KEY: ${GROQ_API_KEY:?GROQ_API_KEY missing}
    depends_on:
      - chromadb
    volumes:
      - ./rag-service/data:/app/data:ro
  

  backend:
    build: ./backend
    container_name: complianceiq-backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://complianceiq:${POSTGRES_PASSWORD}@postgres:5432/complianceiq
      RAG_SERVICE_URL: http://rag-service:4000
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET missing}
      RESEND_API_KEY: ${RESEND_API_KEY}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL}
      GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID}
      FRONTEND_URL: http://localhost:5173
    depends_on:
      postgres:
        condition: service_healthy
      rag-service:
        condition: service_started
    

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:3000/api
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID}
    container_name: complianceiq-frontend
    restart: unless-stopped
    ports:
      - "5173:4173"
    depends_on:
      - backend
   

volumes:
  postgres_data:
  chroma_data: