services:
  postgres:
    image: postgres:16-alpine
    container_name: complianceiq-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: complianceiq
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: complianceiq
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  chromadb:
    image: chromadb/chroma:1.5.3
    container_name: complianceiq-chroma
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - chroma_data:/chroma/chroma

  rag-service:
    build: ./rag-service
    container_name: complianceiq-rag
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      RAG_PORT: 4000
      CHROMA_URL: http://chromadb:8000
      GROQ_API_URL: https://api.groq.com/openai/v1/chat/completions
      GROQ_API_KEY: ${GROQ_API_KEY}
    depends_on:
      - chromadb
    volumes:
      - ./rag-service/src:/app/src
      - ./rag-service/data:/app/data

  backend:
    build: ./backend
    container_name: complianceiq-backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - ./backend/.env
    depends_on:
      - postgres
      - rag-service
    volumes:
      - ./backend/src:/app/src
      - ./backend/prisma:/app/prisma

  frontend:                         # <-- 2 spaces, same as backend
    build: ./frontend
    container_name: complianceiq-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    env_file:
      - ./frontend/.env
    environment:
      VITE_API_URL: http://localhost:3000/api
    depends_on:
      - backend
    volumes:
      - ./frontend/src:/app/src

volumes:
  postgres_data:
  chroma_data: